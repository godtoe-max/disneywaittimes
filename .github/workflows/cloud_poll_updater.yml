name: 24/7 Cloud Wait Times Ingest & Updater

on:
  schedule:
    # Run every 5 minutes automatically in the cloud
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  poll_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Polling Cycle
        run: |
          python -c "
          import asyncio
          from backend.worker import poll_all_parks, init_db
          async def run():
              init_db()
              await poll_all_parks()
          asyncio.run(run())
          "

      - name: Export Static Data Feeds
        run: |
          python export_static_data.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update 24/7 Disney Wait Times cloud observations"
          file_pattern: "frontend/data/* wait_times.db"
